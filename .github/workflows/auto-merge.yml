# Auto-merge caller for Tier 3 plugin repos, which call the PUBLIC
# reusable-workflows host. This is deliberately NOT identical to the Tier 1/2
# templates: those call the PRIVATE devops-excellence reusable and forward the
# whole-vault OP_SERVICE_ACCOUNT_TOKEN, whereas the public reusable declares
# only the SCOPED OP_AUTOMERGE_PUBLIC_TOKEN (read-only on the ip-automation-public
# vault, per ADR-045 / ip-bots#207). GitHub also blocks a public repo from
# calling a private reusable workflow, which is why Tier 3 uses the public host.
# Passing OP_SERVICE_ACCOUNT_TOKEN here is an UNDECLARED secret and fails the run
# at compile time (startup_failure — "workflow file issue").
#
# The tier3-claude-plugin and tier3-omnifocus-plugin copies of this file are
# byte-identical by design (the fitness spec sources one governance set for both).
#
# `closed` is included in pull_request.types (added per devops-excellence#519)
# so the reusable's close-linked-issues job can fire post-merge. That job
# mints an ip-labeler token (issues:write) — ip-automerge deliberately holds
# none, per ip-bots ADR-026 — via a SECOND scoped public token,
# OP_LABELER_PUBLIC_TOKEN, mirroring OP_AUTOMERGE_PUBLIC_TOKEN's ADR-045
# pattern but for the ip-labeler PEM. See ADR-075.
#
# A THIRD scoped public token, OP_AUDITOR_PUBLIC_TOKEN, mints an
# ip-org-auditor token (read-only) that powers ONLY the resolve step inside
# close-linked-issues — resolving closingIssuesReferences needs both
# pull-requests:read and issues:read, which neither github.token nor
# ip-labeler alone carries. See devops-excellence#536-538 and ADR-078.
#
# `labeled`/`unlabeled` are included (devops-excellence#520 / ADR-080) so the
# reusable's hold-for-review check re-evaluates when that label is applied to
# or removed from an already-open PR, not only at open/push time.

name: Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-Merge
    uses: Integral-Productivity/reusable-workflows/.github/workflows/reusable-auto-merge.yml@v1
    secrets:
      OP_AUTOMERGE_PUBLIC_TOKEN: ${{ secrets.OP_AUTOMERGE_PUBLIC_TOKEN }}
      OP_LABELER_PUBLIC_TOKEN: ${{ secrets.OP_LABELER_PUBLIC_TOKEN }}
      OP_AUDITOR_PUBLIC_TOKEN: ${{ secrets.OP_AUDITOR_PUBLIC_TOKEN }}
